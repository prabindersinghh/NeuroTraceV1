[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
# Third-party noise only — nothing from app.* is silenced.
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:audioread.*
    ignore::DeprecationWarning:librosa.*
    ignore::FutureWarning:librosa.*
    ignore:PySoundFile failed:UserWarning
    ignore:SymbolDatabase.GetPrototype:UserWarning
